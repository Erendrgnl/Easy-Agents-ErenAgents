[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "erenagents"
description = "LangChain/LangGraph based library for building agents with multi-provider, MCP and A2A support."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Eren Durgunlu", email = "erendurgunlu@gmail.com" }]
keywords = ["agent", "agents", "langchain", "langgraph", "mcp", "a2a", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dynamic = ["version"]
dependencies = [
    "langchain>=1.0",
    "langgraph>=1.0",
    "langchain-mcp-adapters>=0.2",
    "a2a-sdk>=0.3,<0.4",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/Erendrgnl/Easy-Agents-ErenAgents"
Repository = "https://github.com/Erendrgnl/Easy-Agents-ErenAgents"
Issues = "https://github.com/Erendrgnl/Easy-Agents-ErenAgents/issues"

[project.optional-dependencies]
openai = ["langchain-openai>=1.0"]
anthropic = ["langchain-anthropic>=1.0"]
google = ["langchain-google-genai>=4.0"]
langfuse = ["langfuse>=3"]
all = [
    "langchain-openai>=1.0",
    "langchain-anthropic>=1.0",
    "langchain-google-genai>=4.0",
    "langfuse>=3",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.setuptools.dynamic]
version = { attr = "erenagents._version.VERSION" }

[tool.setuptools.packages.find]
include = ["erenagents*"]
